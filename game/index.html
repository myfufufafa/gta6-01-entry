<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — an open-world crime game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0e13'/%3E%3Ccircle cx='16' cy='14' r='7' fill='%23f1c40f'/%3E%3Crect x='6' y='22' width='20' height='3' rx='1.5' fill='%232e86c1'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; background: #a3ad7c;
    box-shadow: 0 0 60px rgba(0,0,0,0.6); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"
  aria-label="Solmar Bay: an open-world crime game. Walk with WASD, drive with W and S, steal cars with E, aim with the mouse."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
